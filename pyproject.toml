[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ASYNC", # flake8-async
]
ignore = ["E501", "E402", "B008", "B904"]

[tool.mypy]
python_version = "3.10"
ignore_errors = true
ignore_missing_imports = true
exclude = ["venv", ".venv"]
