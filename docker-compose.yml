services:
  database:
    image: postgres:15-alpine
    container_name: gateway-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: intragate_gateway
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - gateway-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intragate_gateway"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intragate-gateway
    restart: unless-stopped
    ports:
      - "9090:9000"  # User Portal: mapped to 9090 to avoid conflict with Portainer on 9000
      # Admin Panel is bound strictly to localhost (127.0.0.1) for security.
      # Reached via: SSH tunnel (ssh -L 8585:127.0.0.1:8585 user@host) or Traefik IP-allowlist.
      - "127.0.0.1:8585:8585"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@database:5432/intragate_gateway
      - GATEWAY_SECRET_KEY=${GATEWAY_SECRET_KEY}
      - GATEWAY_ENCRYPTION_KEY=${GATEWAY_ENCRYPTION_KEY}
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=9000
      - ADMIN_PORT=8585
      - TRUSTED_PROXIES=${TRUSTED_PROXIES}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - uploads-data:/app/data/uploads
      - .env:/app/.env
    networks:
      - gateway-net

volumes:
  db-data:
  uploads-data:

networks:
  gateway-net:
    driver: bridge
